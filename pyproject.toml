[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "address-pipeline"
version = "0.1.0"
description = "Load standardized civic address GeoPackages into a GeoParquet lake and a DuckDB warehouse, with a schema contract, SQL models and SQL data checks."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Yanice Zeng" }]
dependencies = [
    "geopandas>=0.14",
    "duckdb>=1.0",
    "pyarrow>=15",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
addrpipe = "addrpipe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
addrpipe = ["models/*.sql", "checks/*.sql"]

[tool.ruff]
line-length = 125
target-version = "py310"
extend-exclude = ["pipeline_out"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
